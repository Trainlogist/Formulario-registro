<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainlogist - Selección de Formulario</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.logo{
    max-width:500px;
    width:80%;
    margin-bottom:50px;
}

.boton{
    width:450px;
    max-width:90%;
    height:120px;
    margin:15px;
    border:none;
    border-radius:15px;
    font-size:32px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    transition:0.2s;
}

.boton:hover{
    transform:scale(1.03);
}

.termas{
    background:#0099cc;
}

.central{
    background:#4b2e83;
}

</style>
</head>

<body>

<img src="logo.jpg" alt="Trainlogist" class="logo">

<button class="boton termas"
onclick="window.location.href='https://forms.office.com/e/Jg8jEyEvbw'">
FORMULARIO TERMAS
</button>

<button class="boton central"
onclick="window.location.href='https://forms.office.com/e/vaUT32Bbtr'">
FORMULARIO CENTRAL
</button>

</body>
</html>
